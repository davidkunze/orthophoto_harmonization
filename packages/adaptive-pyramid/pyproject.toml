[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "adaptive-pyramid"
version = "0.1.0"

dependencies = [
    "rasterio",
    "numpy",
    "shapely",
    "lxml"
]


[project.scripts]
adaptive-pyramid = "adaptive_pyramid.cli:main"


[tool.setuptools.packages.find]
where = ["."]